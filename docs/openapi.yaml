  /admin/notifications:
    post:
      tags: [ "Osip · Notifications Admin" ]
      summary: Отправка уведомления (сотруднику или всем)
      description: |
        Owner: osip

        Middleware: is_admin

        FormRequest: CreateNotificationRequest
        Два варианта:
        1. Отправка сотруднику: send_to_employee = true, обязателен user_email
        2. Отправка всем: send_to_employee = false (или отсутствует), user_email не нужен

        Handler: CreateNotificationHandler
        - отправляет персональное уведомление сотруднику или всем пользователям
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ title, message ]
              properties:
                title:
                  type: string
                  maxLength: 255
                  example: "Уведомление"
                message:
                  type: string
                  maxLength: 5000
                  example: "Текст уведомления"
                send_to_employee:
                  type: boolean
                  description: "true - сотруднику, false/отсутствует - всем"
                  example: true
                user_email:
                  type: string
                  format: email
                  description: "Обязателен если send_to_employee = true"
                  example: "employee@example.com"
            examples:
              to_employee:
                summary: Отправка сотруднику
                value:
                  title: "Личное уведомление"
                  message: "Дмитрий, внимание!"
                  send_to_employee: true
                  user_email: "dimassikbox@gmail.com"
              to_all:
                summary: Отправка всем
                value:
                  title: "Общее уведомление"
                  message: "Внимание, важная информация!"
                  send_to_employee: false
      responses:
        "201":
          description: Уведомление отправлено
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    example: "Уведомление отправлено сотруднику"
              examples:
                employee_response:
                  summary: Ответ при отправке сотруднику
                  value:
                    success: true
                    message: "Уведомление отправлено сотруднику"
                all_response:
                  summary: Ответ при отправке всем
                  value:
                    success: true
                    message: "Уведомление отправлено всем"
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка при отправке уведомления" }
                  errors:
                    type: object
                    properties:
                      user_email:
                        type: array
                        items:
                          type: string
                          example: "Пользователь с таким email не найден"
                      send_to_employee:
                        type: array
                        items:
                          type: string
                          example: "Поле send_to_employee обязательно"
        "403":
          description: Доступ запрещен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "This action is unauthorized." }
        "401":
          description: Не авторизован
          content:
            application/json:
