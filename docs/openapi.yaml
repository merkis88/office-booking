openapi: 3.0.3
info:
  title: office-booking API
  version: 1.0.0
  description: |
    Контракт API

    Auth: Sanctum Bearer token.
    Заголовок: Authorization: Bearer <token>

    Роли (users.role_id):
    - 1 = admin
    - 2 = user

    Админский префикс: /api/admin/* защищён middleware is_admin (EnsureUserIsAdmin).
    Manager помещения определяется также по place_managers (place_id + user_id).

    Booking rules (как в коде handlers):
    - Доступ к брони:
      owner: booking.user_id == auth_user.id
      или creator гостевой: booking.user_id == null AND booking.created_by == auth_user.id
      иначе 403 (abort).
    - Перенос/продление: только pending/approved, пересечения запрещены (BookingOverlapService).
    - Cancel: переводит статус в rejected, нельзя если бронь уже началась (start_time isPast()).
    - Reschedule: нельзя в прошлое; если был approved -> становится pending.
    - Extend: minutes/preset; нельзя если end_time уже в прошлом.

servers:
  - url: /api
    description: API base

tags:
  - name: "Merk · Booking"
    description: "Owner: merk. Bookings endpoints."
  - name: "Merk · Admin"
    description: "Owner: merk. Admin bookings/export/approve (+ minimal admin users)."
  - name: "Osip · Auth"
    description: "Авторизация и регистрация"
  - name: "Osip · User Profile"
    description: "Профиль пользователя"
  - name: "Osip · Reviews"
    description: "Отзывы"
  - name: "Osip · Places Public"
    description: "Помещения (публичные)"
  - name: "Osip · Places Admin"
    description: "Администрирование помещений"
  - name: "Osip · Notifications User"
    description: "Уведомления пользователя"
  - name: "Osip · Notifications Admin"
    description: "Администрирование уведомлений"
  - name: "Osip · Services User"
    description: "Заявки на обслуживание (пользователь)"
  - name: "Osip · Services Admin"
    description: "Администрирование заявок"
  - name: "Osip · Service Types Admin"
    description: "Администрирование типов услуг"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    MessageError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          example: "Нет доступа к бронированию"
      required: [message]

    ValidationError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          example: "Ошибка валидации"
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [message, errors]

    UnauthenticatedError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          example: "Не авторизован"
      required: [ message ]

    ForbiddenError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          example: "Доступ запрещен"
      required: [ message ]

    NotFoundError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          example: "Ресурс не найден"
      required: [ message ]

    ReviewAccessError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка"
        errors:
          type: object
          properties:
            error:
              type: array
              items:
                type: string
                example: "Вы не можете удалить чужой отзыв"
      required: [ success, message, errors ]

    PasswordUpdateError:
      type: object
      additionalProperties: false
      properties:
        errors:
          type: object
          properties:
            current_password:
              type: array
              items:
                type: string
                example: "Текущий пароль неверен!"
            password:
              type: array
              items:
                type: string
                example: "Пароли не совпадают!"
      required: [ errors ]

    LoginError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Неверный логин или пароль!"
      required: [ success, message ]

    EmailNotVerifiedError:
      type: object
      additionalProperties: false
      properties:
        message:
          type: string
          example: "Email не подтвержден. Пожалуйста, подтвердите регистрацию"
        errors:
          type: object
          properties:
            email:
              type: array
              items:
                type: string
                example: "Email не подтвержден. Пожалуйста, подтвердите регистрацию"
      required: [ message, errors ]

    PlaceArchiveError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка при архивации"
        errors:
          type: object
          properties:
            place:
              type: array
              items:
                type: string
                example: "У помещения 2 активных бронирований. Используйте force = 1 для принудительной архивации, все брони будут отменены"
      required: [ success, message, errors ]

    PlaceDeleteError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка при удалении"
        errors:
          type: object
          properties:
            place:
              type: array
              items:
                type: string
                example: "Нельзя удалить помещение с активными бронированиями"
      required: [ success, message, errors ]

    PlaceRestoreError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка при восстановлении"
        errors:
          type: object
          properties:
            place:
              type: array
              items:
                type: string
                example: "Помещение \"Офис 101\" не находится в архиве"
      required: [ success, message, errors ]

    PlaceUpdateError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка валидации"
        errors:
          type: object
          properties:
            place:
              type: array
              items:
                type: string
                example: "Нельзя обновлять помещение, находящееся в архиве"
      required: [ success, message, errors ]

    ServiceAccessError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка при экспорте"
        errors:
          type: object
          properties:
            service:
              type: array
              items:
                type: string
                example: "У вас нет доступа к этой заявке"
      required: [ success, message, errors ]

    ServiceBookingError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка при создании заявки"
        errors:
          type: object
          properties:
            booking_id:
              type: array
              items:
                type: string
                example: "У вас нет активной аренды этого помещения"
            service_time:
              type: array
              items:
                type: string
                example: "На это время уже есть активная заявка"
      required: [ success, message, errors ]

    ServiceStatusError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка при обновлении статуса"
        errors:
          type: object
          properties:
            status:
              type: array
              items:
                type: string
                example: "Нельзя изменить статус выполненой заявки"
      required: [ success, message, errors ]

    NotificationAccessError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка"
        errors:
          type: object
          properties:
            notification:
              type: array
              items:
                type: string
                example: "Уведомление не принадлежит этому пользователю"
      required: [ success, message, errors ]

    ForgotPasswordError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка"
        errors:
          type: object
          properties:
            email:
              type: array
              items:
                type: string
                example: "Пользователя с такой почтой не найден"
      required: [ success, message, errors ]

    ServiceDataError:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Ошибка при экспорте"
        errors:
          type: object
          properties:
            service:
              type: array
              items:
                type: string
                example: "Данные о бронировании или помещении не найдены"
      required: [ success, message, errors ]

    Role:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, example: 3 }
        role_name:
          type: string
          example: "user"
      required: [id, role_name]

    User:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer, example: 5 }
        first_name: { type: string, nullable: true, example: "merk1" }
        last_name: { type: string, nullable: true, example: "merk1" }
        patronymic: { type: string, nullable: true, example: null }
        email: { type: string, example: "merk@mail.com" }
        role_id:
          type: integer
          example: 3
          description: "1=admin, 2=manager, 3=user"
        post: { type: string, nullable: true, example: null }
        company: { type: string, nullable: true, example: null }
        photo: { type: string, nullable: true, example: null }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        role:
          allOf:
            - $ref: "#/components/schemas/Role"
          nullable: true
      required: [id, email, role_id]

    Organization:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Business Center" }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
      required: [id, name]

    Place:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer, example: 10 }
        organization_id: { type: integer, nullable: true, example: 1 }
        name: { type: string, example: "Meeting room 1" }
        type: { type: string, nullable: true, example: "meeting_room" }
        capacity: { type: integer, nullable: true, example: 8 }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        organization:
          allOf:
            - $ref: "#/components/schemas/Organization"
          nullable: true
        available_slots:
          type: array
          description: "Доступные слоты на выбранную дату"
          items:
            type: object
            properties:
              start:
                type: string
                example: "09:00"
                description: "Время начала"
              end:
                type: string
                example: "10:00"
                description: "Время окончания"
              time:
                type: string
                example: "09:00 - 10:00"
                description: "Строка для отображения"
      required: [id, name, is_active]

    ParkingPlace:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer, example: 3 }
        place_row: { type: integer, example: 12 }
        status:
          type: string
          example: "free"
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
      required: [id, place_row, status]

    PlaceManager:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer, example: 7 }
        place_id: { type: integer, example: 10 }
        user_id: { type: integer, example: 5 }
        created_from_booking_id: { type: integer, nullable: true, example: 101 }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
      required: [id, place_id, user_id]

    Booking:
      type: object
      additionalProperties: true
      properties:
        id: { type: integer, example: 101 }
        place_id: { type: integer, example: 10 }
        created_by: { type: integer, example: 5 }
        organization_id: { type: integer, nullable: true, example: null }
        user_id:
          type: integer
          nullable: true
          example: 5
          description: "null for guest bookings"
        guest_name: { type: string, nullable: true, example: null }
        parking_place_id: { type: integer, nullable: true, example: null }
        start_time: { type: string, format: date-time, example: "2026-02-10T12:00:00Z" }
        end_time: { type: string, format: date-time, example: "2026-02-10T13:00:00Z" }
        status:
          type: string
          enum: [pending, approved, rejected]
          example: pending
        pass_type:
          type: string
          enum: [qr, pin]
          example: qr
        price: { type: number, nullable: true, example: null }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

        place:
          allOf:
            - $ref: "#/components/schemas/Place"
          nullable: true
        user:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        creator:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        organization:
          allOf:
            - $ref: "#/components/schemas/Organization"
          nullable: true
        parkingPlace:
          allOf:
            - $ref: "#/components/schemas/ParkingPlace"
          nullable: true
      required: [id, place_id, created_by, start_time, end_time, status, pass_type]

    BookingDataResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/Booking"
      required: [data]

    PaginatedBookings:
      type: object
      additionalProperties: true
      description: "Laravel LengthAwarePaginator JSON"
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        per_page: { type: integer, example: 20 }
        total: { type: integer, example: 42 }
      required: [current_page, data]

    Review:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, example: 1 }
        text: { type: string, example: "ФУ, мне не понравилось, но обслуживание на 3 потянет" }
        rating: { type: integer, minimum: 1, maximum: 5, example: 3 }
        user_id: { type: integer, example: 2 }
        created_at: { type: string, format: date-time, example: "2026-03-10T14:30:00Z" }
        updated_at: { type: string, format: date-time, example: "2026-03-10T14:30:00Z" }
        user:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
      required: [ id, text, rating, user_id, created_at ]

    Service:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, example: 1 }
        user_id: { type: integer, example: 2 }
        booking_id: { type: integer, example: 1 }
        service_type_id: { type: integer, example: 1 }
        service_date: { type: string, format: date, example: "2026-03-20" }
        service_time: { type: string, format: time, example: "14:30" }
        comment: { type: string, nullable: true, example: "Нужно помыть окна" }
        status:
          type: string
          enum: [ pending, in_progress, completed, rejected ]
          example: pending
        status_name: { type: string, example: "В ожидании" }
        created_at: { type: string, format: date-time, example: "2026-03-10T14:30:00Z" }
        user:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
        booking:
          allOf:
            - $ref: "#/components/schemas/Booking"
          nullable: true
        place:
          allOf:
            - $ref: "#/components/schemas/Place"
          nullable: true
        service_type:
          type: object
          properties:
            id: { type: integer, example: 1 }
            name: { type: string, example: "ТО" }
      required: [ id, user_id, booking_id, service_type_id, service_date, service_time, status ]

    ServiceType:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: "Клининг" }
        description: { type: string, nullable: true, example: "Уборка помещений" }
        is_active: { type: boolean, example: true }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
      required: [ id, name, is_active ]

    Notification:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: "Новое уведомление" }
        message: { type: string, example: "Текст уведомления" }
        is_read: { type: boolean, example: false }
        read_at: { type: string, format: date-time, nullable: true, example: null }
        created_at: { type: string, format: date-time, example: "2026-03-10T14:30:00Z" }
        creator:
          allOf:
            - $ref: "#/components/schemas/User"
          nullable: true
      required: [ id, title, message, created_at ]

    PaginatedNotifications:
      type: object
      additionalProperties: true
      properties:
        current_page: { type: integer, example: 1 }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        per_page: { type: integer, example: 10 }
        total: { type: integer, example: 50 }
        unread_count: { type: integer, example: 3 }
      required: [ current_page, data ]

    PlaceWithFilters:
      type: object
      additionalProperties: false
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: "#/components/schemas/Place"
        filters:
          type: object
          properties:
            price_range:
              type: object
              properties:
                min_price: { type: number, example: 1000 }
                max_price: { type: number, example: 5000 }
            current:
              type: object
              properties:
                min_price: { type: number, example: 1000 }
                max_price: { type: number, example: 5000 }

    ArchiveStatus:
      type: object
      additionalProperties: false
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            is_active: { type: boolean, example: true }
            is_archived: { type: boolean, example: false }
            active_bookings_count: { type: integer, example: 2 }
            can_archive: { type: boolean, example: true }
            can_restore: { type: boolean, example: false }
            force_available: { type: boolean, example: true }

    MyBookingForService:
      type: object
      properties:
        id: { type: integer, example: 1 }
        place_name: { type: string, example: "Переговорная А" }
        place_number: { type: integer, example: 101 }
        date: { type: string, example: "15.03.2026" }
        time: { type: string, example: "10:00 - 12:00" }

  responses:
    Forbidden:
      description: Forbidden (abort(403, ...))
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageError"
          examples:
            no_access_booking:
              value: { message: "Нет доступа к бронированию" }
            need_admin:
              value: { message: "Требуется права админа" }

    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageError"
          examples:
            not_found:
              value: { message: "Not Found" }

    ValidationFailed:
      description: Validation error (ValidationException)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
          examples:
            example_status:
              value:
                message: "The given data was invalid."
                errors:
                  status:
                    - "Нельзя переносить бронирование в текущем статусе"
    UnauthenticatedResponse:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthenticatedError"

    ForbiddenResponse:
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ForbiddenError"

    NotFoundResponse:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"

    ValidationFailedResponse:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"

security:
  - bearerAuth: []

paths:
  /bookings:
    post:
      tags: ["Merk · Booking"]
      summary: Create booking
      description: |
        Owner: merk

        FormRequest: CreateBookingRequest
        - place_id required, integer, exists:places,id
        - start_time required, date_format:c
        - end_time required, date_format:c, after:start_time
        - pass_type sometimes in [qr,pin] (default qr)

        Handler: CreateBookingHandler
        - booking всегда создаётся от имени авторизованного пользователя
        - user_id = auth_user.id
        - created_by = auth_user.id
        - user_id не принимается из body
        - overlap check через BookingOverlapService (422 ValidationException)
        - business hours check через BookingBusinessHoursService (422 ValidationException)

        Ответ: 201 {data: Booking} (load place,user,creator)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                place_id:
                  type: integer
                start_time:
                  type: string
                  format: date-time
                  description: "ISO 8601 datetime, example: 2026-02-10T12:00:00Z"
                end_time:
                  type: string
                  format: date-time
                  description: "ISO 8601 datetime, must be after start_time"
                pass_type:
                  type: string
                  enum: [qr, pin]
                  nullable: true
                  description: "Optional, default is qr"
              required: [place_id, start_time, end_time]
            examples:
              booking_qr:
                value:
                  place_id: 10
                  start_time: "2026-02-10T12:00:00Z"
                  end_time: "2026-02-10T13:00:00Z"
                  pass_type: "qr"
              booking_pin:
                value:
                  place_id: 10
                  start_time: "2026-02-10T12:00:00Z"
                  end_time: "2026-02-10T13:00:00Z"
                  pass_type: "pin"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDataResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"


  /bookings/my:
    get:
      tags: [ "Merk · Booking" ]
      summary: List my bookings
      description: |
        Owner: merk

        Нужен для получения списка бронирований текущего авторизованного пользователя.
        Используется на экране "Мои бронирования" для вывода всех броней пользователя
        с возможностью фильтрации по статусу, помещению и диапазону дат.

        FormRequest: MyBookingsRequest
        - status nullable in ['active', 'cancelled']
        - place_id nullable exists:places,id
        - from nullable date
        - to nullable date
        - sort nullable in [start_time, -start_time] (default -start_time => desc)
        - per_page nullable int 1..100 (default 20)

        Handler: MyBookingHandler
        - where user_id = auth_user.id
        - with('place')
        - paginate(perPage)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [ active, cancelled ]
        - in: query
          name: place_id
          schema: { type: integer }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: sort
          schema:
            type: string
            enum: [ start_time, -start_time ]
            example: "-start_time"
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBookings"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /bookings/{booking}:
    get:
      tags: [ "Merk · Booking" ]
      summary: Show booking
      description: |
        Owner: merk

        Нужен для просмотра одной конкретной брони по её id.
        Используется, когда пользователь нажимает на бронь в списке "Мои бронирования"
        и открывает карточку или детальную страницу выбранного бронирования.

        Controller: showBooking -> ShowBookingHandler
        - load('place')
        - доступ только владельцу бронирования (иначе abort 403)
      parameters:
        - in: path
          name: booking
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDataResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /bookings/{booking}/cancel:
    post:
      tags: ["Merk · Booking"]
      summary: Cancel booking (status -> rejected)
      description: |
        Owner: merk

        Handler: CancelBookingHandler
        - доступ: owner или creator гостевой, иначе 403
        - если status == rejected -> 422 (status: "Бронирование уже отменено")
        - если status не active / cancelled -> 422
        - если start_time isPast() -> 422 (start_time: "Нельзя отменить бронирование которе уже началось")
        - иначе status = rejected, load('place')
      parameters:
        - in: path
          name: booking
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDataResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /bookings/{booking}/reschedule:
    post:
      tags: ["Merk · Booking"]
      summary: Reschedule booking
      description: |
        Owner: merk

        FormRequest: RescheduleBookingRequest
        - start_time required date
        - end_time required date after start_time

        Handler: RescheduleBookingHandler
        - доступ: owner или creator гостевой, иначе 403
        - start_time в прошлом -> 422
        - status должен быть pending/approved, иначе 422
        - overlap check (ignoreBookingId = booking.id) -> 422
        - если status был approved -> становится pending
        - сохраняет новые start/end, load('place')
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                start_time: { type: string, format: date-time }
                end_time: { type: string, format: date-time }
              required: [start_time, end_time]
            examples:
              move:
                value:
                  start_time: "2026-02-10T14:00:00Z"
                  end_time: "2026-02-10T15:00:00Z"
      parameters:
        - in: path
          name: booking
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDataResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"


  /bookings/{booking}/extend:
    post:
      tags: ["Merk · Booking"]
      summary: Extend booking
      description: |
        Owner: merk

        FormRequest: ExtendBookingRequest
        - minutes nullable int 1..1440 required_without:preset
        - preset nullable enum [10m, 1h, 1d] required_without:minutes
        minutes() вычисляется:
        - minutes если передан
        - иначе preset => 10|60|1440
        - иначе 0 (и handler вернёт 422)

        Handler: ExtendBookingHandler
        - доступ: owner или creator гостевой, иначе 403
        - status должен быть pending/approved, иначе 422
        - end_time в прошлом -> 422
        - overlap check (ignoreBookingId = booking.id) -> 422
        - сохраняет новый end_time, load('place')
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  properties:
                    minutes:
                      type: integer
                      minimum: 1
                      maximum: 1440
                  required: [minutes]
                - type: object
                  additionalProperties: false
                  properties:
                    preset:
                      type: string
                      enum: [10m, 1h, 1d]
                  required: [preset]
            examples:
              by_minutes:
                value: { minutes: 30 }
              by_preset:
                value: { preset: "1h" }
      parameters:
        - in: path
          name: booking
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDataResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"


  /profile/qrs:
    get:
      tags: [ "Merk · Profile" ]
      summary: List my QRs
      description: |
        Owner: merk

        Auth: Sanctum Bearer token.

        Route: GET /api/profile/qrs
        Controller: ProfileQrController@index(Request, GetProfileQrsHandler)
        Handler: GetProfileQrsHandler::handle(auth_user)

        Возвращает QR-коды текущего авторизованного пользователя (профиль).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Qr"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /profile:
    get:
      tags: [ "Merk · Profile" ]
      summary: Show current user profile
      description: |
        Owner: merk

        Нужен для получения данных текущего авторизованного пользователя.
        Используется на экране "Профиль" для отображения основной информации о пользователе:
        имя, фамилия, отчество, номер телефона, email и роль.

        Controller: ProfileController@profile
        Handler: GetProfileHandler
        - получает текущего auth_user
        - возвращает данные текущего пользователя
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

    patch:
      tags: [ "Merk · Profile" ]
      summary: Update current user profile
      description: |
        Owner: merk

        Нужен для изменения данных текущего авторизованного пользователя.
        Используется на экране "Редактирование профиля" для обновления имени, фамилии,
        отчества, номера телефона и email.

        FormRequest: UpdateProfileRequest
        - first_name sometimes|string|max:255
        - last_name sometimes|string|max:255
        - middle_name nullable|string|max:255
        - phone sometimes|string|max:30|unique:users,phone,except current user
        - email sometimes|string|email|max:255|unique:users,email,except current user

        Controller: ProfileController@update
        Handler: UpdateProfileHandler
        - обновляет только переданные поля
        - сохраняет изменения пользователя
        - возвращает обновлённые данные профиля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

    delete:
      tags: [ "Merk · Profile" ]
      summary: Delete current user profile
      description: |
        Owner: merk

        Нужен для удаления аккаунта текущего авторизованного пользователя.
        Используется на экране "Профиль" после подтверждения удаления аккаунта.

        FormRequest: DeleteProfileRequest
        - password required|string

        Controller: ProfileController@delete
        Handler: DeleteProfileHandler
        - проверяет корректность текущего пароля через Hash::check
        - если пароль неверный -> 422 (errors.password)
        - удаляет токены пользователя
        - удаляет пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteProfileRequest"
      responses:
        "204":
          description: No Content
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /admin/bookings:
    get:
      tags: ["Merk · Admin"]
      summary: Admin list bookings
      description: |
        Owner: merk

        Middleware: is_admin (EnsureUserIsAdmin: role_id == 1)

        FormRequest: AdminBookingsRequest
        - status nullable in [pending, approved, rejected]
        - place_id nullable exists:places,id
        - user_id nullable exists:users,id
        - created_by nullable exists:users,id
        - from nullable date
        - to nullable date
        - sort nullable in [start_time, -start_time] (default -start_time => desc)
        - per_page nullable int 1..100 (default 20)

        Handler: AdminListBookingsHandler
        - with(place,user,creator)
        - filters + orderBy(start_time, sortDirection)
        - paginate(perPage)
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: place_id
          schema: { type: integer }
        - in: query
          name: user_id
          schema: { type: integer }
        - in: query
          name: created_by
          schema: { type: integer }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: sort
          schema:
            type: string
            enum: [start_time, -start_time]
            example: "-start_time"
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 20
        - in: query
          name: page
          schema: { type: integer, minimum: 1, example: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBookings"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /admin/bookings/export:
    get:
      tags: ["Merk · Admin"]
      summary: Admin export bookings (CSV)
      description: |
        Owner: merk

        Middleware: is_admin (role_id == 1)

        Controller: export(AdminBookingsRequest, AdminExportBookingsHandler, AdminListBookingsHandler)
        - Content-Type: text/csv; charset=UTF-8
        - separator: ;
        - BOM added
        - filename: bookings_YYYYmmdd_His.csv
        - колонки:
          id;status;place_id;place_name;user_id;guest_name;created_by;start_time;end_time;pass_type

        Фильтры берутся из AdminBookingsRequest (как /admin/bookings).
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: place_id
          schema: { type: integer }
        - in: query
          name: user_id
          schema: { type: integer }
        - in: query
          name: created_by
          schema: { type: integer }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: sort
          schema:
            type: string
            enum: [start_time, -start_time]
            example: "-start_time"
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
            maximum: 100
            example: 100
        - in: query
          name: page
          schema: { type: integer, minimum: 1, example: 1 }
      responses:
        "200":
          description: CSV stream
          content:
            text/csv:
              schema:
                type: string
              examples:
                sample:
                  value: |
                    id;status;place_id;place_name;user_id;guest_name;created_by;start_time;end_time;pass_type
                    101;approved;10;Meeting room 1;5;;5;2026-02-10 12:00:00;2026-02-10 13:00:00;qr
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageError"

  /qr/{booking}/guest-qr:
    post:
      tags: [ "Merk · QR" ]
      summary: Create guest QR
      description: |
        Owner: merk
        Auth: Sanctum Bearer token.

        Выдача qr-кода для гостя
      parameters:
        - in: path
          name: booking
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ recipient_email ]
              properties:
                recipient_email: { type: string, format: email }
                guest_name: { type: string, nullable: true }
                time_window: { type: integer, nullable: true }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /qr/{booking}/user-qr:
    post:
      tags: [ "Merk · QR" ]
      summary: Create user QR (current user)
      description: |
        Owner: merk
        Auth: Sanctum Bearer token.

        Выдача qr-кода для арендатора помещения
      parameters:
        - in: path
          name: booking
          required: true
          schema: { type: integer }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /qr/{booking}/issue-qr:
    post:
      tags: [ "Merk · QR" ]
      summary: Issue QR to another registered user
      description: |
        Owner: merk
        Auth: Sanctum Bearer token.

        Выдача qr-кода, другому пользователю от арендатора помещения
      parameters:
        - in: path
          name: booking
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ recipient_user_id ]
              properties:
                recipient_user_id: { type: integer }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /register:
    post:
      tags: [ "Osip · Auth" ]
      summary: Регистрация нового пользователя
      description: |
        Owner: osip

        FormRequest: RegisterRequest
        - first_name required string max:255
        - last_name required string max:255
        - patronymic nullable string max:255
        - email required email unique:users
        - password required confirmed (Password::defaults())
        - password_confirmation required string
        - role_id exists:roles,id (default 2)
        - post nullable string max:255
        - company nullable string max:255
        - photo nullable string max:255

        Handler: RegisterHandler
        - создаёт пользователя с is_verified = false
        - отправляет код подтверждения через SendVerificationHandler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ first_name, last_name, email, password, password_confirmation ]
              properties:
                first_name: { type: string, example: "Иван" }
                last_name: { type: string, example: "Иванов" }
                patronymic: { type: string, nullable: true, example: "Иванович" }
                email: { type: string, format: email, example: "user@example.com" }
                password: { type: string, format: password, example: "Password123!" }
                password_confirmation: { type: string, format: password, example: "Password123!" }
                role_id: { type: integer, nullable: true, example: 2 }
                post: { type: string, nullable: true, example: "Разработчик" }
                company: { type: string, nullable: true, example: "ООО Ромашка" }
                photo: { type: string, nullable: true, example: "photo.jpg" }
      responses:
        "201":
          description: Успешная регистрация
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Регистрация прошла успешно!" }
                  user:
                    $ref: "#/components/schemas/User"
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "The given data was invalid." }
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        items:
                          type: string
                          example: "Пользователь с таким email уже существует"
                      password:
                        type: array
                        items:
                          type: string
                          example: "Пароли не совпадают"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"

  /login:
    post:
      tags: ["Osip · Auth"]
      summary: Авторизация пользователя
      description: |
        Owner: osip

        FormRequest: LoginRequest
        -email required email
        -password required string

        Handler: LoginHandler
        - проверяет существование пользователя и пароль
        - проверяет is_verified (иначе 422)
        - создает токен (createToken)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email,password]
              properties:
                email: { type: string, format: email, example: "user@example.com" }
                password: { type: string, format: password, example: "Password123!" }
      responses:
        "200":
          description: Успешная авторизация
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Авторизация прошла успешно" }
                  user:
                    $ref: "#/components/schemas/User"
                  token: { type: string, example: "1|s0m3R4nd0mT0k3nStr1ng" }
        "401":
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginError"
        "422":
          description: Email не подтвержден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailNotVerifiedError"

  /logout:
    post:
      tags: [ "Osip · Auth" ]
      summary: Выход из системы
      description: |
        Owner: osip

        Handler: LogoutHandler
        - удаляет текущий токен доступа
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Успешный выход
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Вы успешно вышли" }
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"

  /me:
    get:
      tags: [ "Osip · Auth" ]
      summary: Информация о текущем пользователе
      description: |
        Owner: osip

        Возвращает данные авторизованного пользователя
      security:
        - bearerAuth: [ ]
      responses:
        "200":
          description: Данные пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"

  /verify-email:
    post:
      tags: [ "Osip · Auth" ]
      summary: Подтверждение email
      description: |
        Owner: osip

        FormRequest: VerifyEmailRequest
        - email required email exists:users
        - code required string size:6

        Handler: VerifyEmailHandler
        - проверяет код подтверждения
        - если код верный - помечает пользователя как верифицированного
        - создаёт токен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ email, code ]
              properties:
                email: { type: string, format: email, example: "user@example.com" }
                code: { type: string, example: "123456" }
      responses:
        "200":
          description: Email подтвержден
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Email успешно подтвержден" }
                  user:
                    $ref: "#/components/schemas/User"
                  token: { type: string, example: "1|s0m3R4nd0mT0k3nStr1ng" }
        "422":
          description: Ошибка подтверждения
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка подтверждения" }
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        items:
                          type: string
                          example: "Пользователь с таким email не найден"
                      code:
                        type: array
                        items:
                          type: string
                          example: "Неверный код подтверждения"

  /resend-verification:
    post:
      tags: [ "Osip · Auth" ]
      summary: Повторная отправка кода подтверждения
      description: |
        Owner: osip

        FormRequest: ResendVerificationRequest
        - email required email exists:users

        Handler: SendVerificationHandler::resend
        - генерирует новый код и отправляет на email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ email ]
              properties:
                email: { type: string, format: email, example: "user@example.com" }
      responses:
        "200":
          description: Код отправлен повторно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Код подтверждения отправлен повторно" }
        "422":
          description: Ошибка
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка" }
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        items:
                          type: string
                          example: "Пользователь с таким email не найден"

  /forgot-password:
    post:
      tags: ["Osip · Auth"]
      summary: Восстановление пароля (sendTemporaryPassword)
      description: |
        Owner: osip

        FormRequest: ForgotPasswordRequest
        - email required email exists:users

        Handler: SendTemporaryPasswordHandler
        - генерирует временный пароль (Str::random(8))
        - сохраняет его в БД (хэшированный)
        - отправляет на email через TemporaryPasswordMail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, example: "user@example.com" }
      responses:
        "200":
          description: Временный пароль отправлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Временный пароль отправлен на вашу почту" }
        "422":
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordError"
        "500":
          description: Ошибка отправки
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка при отправке" }

  /user/password:
    put:
      tags: [ "Osip · User Profile" ]
      summary: Обновление пароля текущего пользователя (updatePassword)
      description: |
        Owner: osip

        FormRequest: UserUpdatePasswordRequest
        - current_password required|current_password
        - password required|string|min:8|confirmed
        - password_confirmation required|string

        Handler: UpdatePasswordHandler
        - проверяет текущий пароль (Hash::check)
        - обновляет на новый
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ current_password, password, password_confirmation ]
              properties:
                current_password: { type: string, format: password, example: "oldpassword123" }
                password: { type: string, format: password, example: "newpassword123" }
                password_confirmation: { type: string, format: password, example: "newpassword123" }
      responses:
        "200":
          description: Пароль обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Пароль успешно обновлен" }
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordUpdateError"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"

  /reviews:
    post:
      tags: ["Osip · Reviews"]
      summary: Создание нового отзыва (createReview)
      description: |
        Owner: osip

        FormRequest: CreateReviewRequest
        - text required string min:16 max:1000
        - rating required integer between:1,5

        Handler: CreateReviewHandler
        - проверяет hasVerifiedEmail() (иначе 422)
        - проверяет rating < 1 (422)
        - создаёт отзыв с user_id = auth_user.id
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text, rating]
              properties:
                text: { type: string, example: "ФУ, мне не понравилось, но обслуживание на 3 потянет" }
                rating: { type: integer, minimum: 1, maximum: 5, example: 3 }
      responses:
        "201":
          description: Отзыв создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Отзыв успешно добавлен!" }
                  data:
                    $ref: "#/components/schemas/Review"
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка валидации" }
                  errors:
                    type: object
                    properties:
                      text:
                        type: array
                        items:
                          type: string
                          example: "Отзыв должен содержать минимум 16 символов"
                      rating:
                        type: array
                        items:
                          type: string
                          example: "Выберите от 1 до 5 звёзд"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"
    get:
      tags: [ "Osip · Reviews" ]
      summary: Фильтра отзывов по рейтингу
      description: |
        Owner: osip

        FormRequest: ReviewFilterRequest
        - rating nullable integer in:1,2,3,4,5
        - sort_by nullable string in:created_at,rating(default created_at)
        - sort_direction nullable string in: asc,desc ( default desc)

        Handler: FilterReviewHandler
        - фильтрует по рейтингу если передан
      parameters:
        - in: query
          name: rating
          schema: { type: integer, enum: [ 1,2,3,4,5 ], example: 5 }
        - in: query
          name: sort_direction
          schema: { type: string, enum: [ desc,asc ], example: "desc" }
      responses:
        "200":
          description: Список отзывов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /reviews/{review}:
    delete:
      tags: [ "Osip · Reviews" ]
      summary: Удаление отзыва (deleteReview)
      description: |
        Owner: osip

        FormRequest: DeleteReviewRequest
        - authorize: admin может всё, иначе проверка user_id

        Handler: DeleteReviewHandler
        - удаляет отзыв
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: review
          required: true
          schema: { type: integer, example: 8 }
      responses:
        "200":
          description: Отзыв удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Отзыв успешно удален" }
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "422":
          description: Ошибка доступа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewAccessError"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"

    put:
      tags: [ "Osip · Reviews" ]
      summary: Обновление отзыва (updateReview)
      description: |
        Owner: osip

        FormRequest: UpdateReviewRequest
        - text sometimes min:16 max:1000
        - rating sometimes integer in:1,2,3,4,5
        - authorize: admin может всё, иначе проверка user_id

        Handler: UpdateReviewHandler
        - обновляет только переданные поля
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: review
          required: true
          schema: { type: integer, example: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, example: "Обновленный текст отзыва" }
                rating: { type: integer, minimum: 1, maximum: 5, example: 4 }
      responses:
        "200":
          description: Отзыв обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Отзыв обновлен" }
                  data:
                    $ref: "#/components/schemas/Review"
        "403":
          $ref: "#/components/responses/ForbiddenResponse"
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка валидации" }
                  errors:
                    type: object
                    properties:
                      rating:
                        type: array
                        items:
                          type: string
                          example: "Выберите от 1 до 5 звёзд"
        "401":
          $ref: "#/components/responses/UnauthenticatedResponse"

  /places:
    get:
      tags: [ "Osip · Places Public" ]
      summary: Список доступных помещений (по умолчанию на сегодня)
      description: |
        Owner: osip

        FormRequest: IndexPlaceRequest, FilterPlaceRequest
        - type nullable in:office,coworking,meeting
        - min_price nullable numeric
        - max_price nullable numeric
        - date nullable date - если не указана, используется сегодня

        Handler: ListPlaceHandler, FilterPlaceHandler, PlaceAvailabilityService
        - возвращает только is_active = true
        - фильтрует по цене
        - по умолчанию: дата = сегодня
        - возвращает только помещения с доступными слотами на указанную дату
        - для каждого помещения возвращает список свободных слотов (длительность 60 минут)
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [ office, coworking, meeting ], example: "meeting" }
          description: "Тип помещения"
        - in: query
          name: min_price
          schema: { type: number, format: float, example: 1000 }
          description: "Минимальная цена"
        - in: query
          name: max_price
          schema: { type: number, format: float, example: 5000 }
          description: "Максимальная цена"
        - in: query
          name: date
          schema: { type: string, format: date, example: "2026-03-14" }
          description: "Дата для проверки доступности (если не указана - сегодня)"
      responses:
        "200":
          description: Список помещений с доступными слотами
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Place"
                  filters:
                    type: object
                    properties:
                      price_range:
                        type: object
                        properties:
                          min_price: { type: number, example: 1000 }
                          max_price: { type: number, example: 5000 }
                      current:
                        type: object
                        properties:
                          min_price: { type: number, example: 1000 }
                          max_price: { type: number, example: 5000 }
                          date: { type: string, example: "2026-03-14" }
              examples:
                with_slots:
                  summary: "Ответ со слотами (по умолчанию)"
                  value:
                    success: true
                    data:
                      - id: 1
                        name: "Переговорная А"
                        type: "meeting"
                        capacity: 10
                        price: 1500
                        available_slots:
                          - start: "09:00"
                            end: "10:00"
                            time: "09:00 - 10:00"
                          - start: "10:00"
                            end: "11:00"
                            time: "10:00 - 11:00"
                          - start: "11:00"
                            end: "12:00"
                            time: "11:00 - 12:00"
                        occupancy_rate: 25.5
                    filters:
                      price_range:
                        min_price: 1000
                        max_price: 5000
                      current:
                        min_price: 1000
                        max_price: 5000
                        date: "2026-03-14"

  /places/{place}:
    get:
      tags: [ "Osip · Places Public" ]
      summary: Детальная информация о помещении (showPlaces)
      description: |
        Owner: osip

        Handler: ShowPlaceHandler
        - проверяет is_active = true (иначе 404)
        - если передан параметр date - возвращает слоты на эту дату
        - если date не передан - возвращает слоты на сегодня
      parameters:
        - in: path
          name: place
          required: true
          schema: { type: integer, example: 3 }
        - in: query
          name: date
          required: false
          schema: { type: string, format: date, example: "2026-03-14" }
          description: "Дата для проверки доступности (если не указана - сегодня)"
      responses:
        "200":
          description: Данные помещения со слотами
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Place"
                  availability:
                    type: object
                    properties:
                      date:
                        type: string
                        example: "2026-03-14"
              examples:
                with_slots:
                  value:
                    success: true
                    data:
                      id: 3
                      name: "Переговорная А"
                      type: "meeting"
                      capacity: 10
                      price: 1500
                      available_slots:
                        - start: "09:00"
                          end: "10:00"
                          time: "09:00 - 10:00"
                        - start: "10:00"
                          end: "11:00"
                          time: "10:00 - 11:00"
                      occupancy_rate: 15.38
                    availability:
                      date: "2026-03-14"
        "404":
          description: Помещение не найдено или неактивно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Помещение не доступно для аренды" }

  /admin/places:
    post:
      tags: ["Osip · Places Admin"]
      summary: Создание нового помещения
      description: |
        Owner: osip

        Middleware: is_admin

        FormRequest: AdminStorePLaceRequest (multipart/form-data)
        - name required string max:255
        - type required in:office,coworking,meeting
        - capacity required integer min:1
        - number_place required integer min:1
        - price required numeric min:0
        - photo required image (jpeg,png,jpg max 5MB)
        - description required string max:5000
        - is_active sometimes boolean

        Handler: AdminCreatePlaceHandler
        - Загружает фото в public/places
        -создает помещение
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, type, capacity, number_place, price, photo, description]
              properties:
                name: { type: string, example: "Офис 101"}
                type: { type: string,enum:[office,coworking,meeting], example: "office"}
                capacity: { type: integer, example: 10}
                number_place: { type: integer, example: 101}
                price: { type: number, format: float, example: 5000}
                photo: { type: string, format: binary}
                description: { type: string, example: "Тыры пыры растапыры"}
                is_active: {type: boolean, example: true}
      responses:
        "201":
          description: Помещение создано
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean, example: false }
                  message: { type: string, example: "Ошибка валидации"}
                  data:
                    $ref: "#/components/schemas/Place"
        "422":
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  photo:
                    type: array
                    items:
                      type: string
                      example: "Размер файла не должен превышать 5MB"
                  name:
                    type: array
                    items:
                      type: string
                      example: "Название помещения обязательно"
        "403":
          description: Доступ запрещен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "This action is unauthorized"}
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Не авторизован"}
    get:
      tags: ["Osip · Places Admin"]
      summary: Список всех помещений(админ)
      description: |
        Owner: osip

        Middleware: is_admin

        FormRequest: AdminIndexRequest
        - type nullable in:office,coworking,meeting
        - is_active nullable boolean
        - archived nullable boolean
        - sort_by nullable in:name,created_at,capacity,number_place
        - sort_direction nullable in:asc,desc
        - per_page nullable integer min:1 max:100 (default 6)
        Controller: AdminPlaceController@index
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [ office, coworking, meeting ] }
        - in: query
          name: is_active
          schema: { type: boolean }
        - in: query
          name: archived
          schema: { type: boolean }
        - in: query
          name: sort_by
          schema: { type: string, enum: [ name, created_at, capacity, number_place ] }
        - in: query
          name: sort_direction
          schema: { type: string, enum: [ asc, desc ], example: "desc" }
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, example: 6 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, example: 1 }
      responses:
          "200":
            description: Список помещений с пагинацией
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    success: { type: boolean, example: true }
                    data:
                      type: array
                      items:
                        $ref: "#/components/schemas/Place"
                    meta:
                      type: object
                      properties:
                        current_page: { type: integer, example: 1 }
                        last_page: { type: integer, example: 5 }
                        per_page: { type: integer, example: 6 }
                        total: { type: integer, example: 30 }
          "403":
            description: Доступ запрещен
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message: { type: string, example: "This action is unauthorized." }
          "401":
            description: Не авторизован
            content:
              application/json:
                schema:
                  type: object
                  properties:
                    message: { type: string, example: "Не авторизован" }

