        - bearerAuth: [ ]
      parameters:
        - in: path
          name: place
          required: true
          schema: { type: integer, example: 3 }
        - in: query
          name: force
          required: false
          schema: { type: integer, enum: [ 0,1 ], default: 0, example: 0 }
      responses:
        "200":
          description: Помещение отправлено в архив
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Помещение успешно отправлено в архив" }
                  data:
                    $ref: "#/components/schemas/Place"
        "201":
          description: Помещение принудительно архивировано
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: "Помещение принудительно отправлено в архив, все активные бронирования отменены" }
                  data:
                    $ref: "#/components/schemas/Place"

        "422":
          description: Есть активные бронирования
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка при архивации" }
                  errors:
                    type: object
                    properties:
                      place:
                        type: array
                        items:
                          type: string
                          example: "У помещения 2 активных бронирований. Используйте force = 1 для принудительной архивации, все брони будут отменены"
        "403":
          description: Доступ запрещен
