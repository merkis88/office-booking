        - генерирует PDF с детальной информацией

        Handler: ExportServiceHandler
        - загружает связи: user, booking.place, serviceType
        - генерирует PDF через DOMPDF
        - возвращает файл для скачивания
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: service
          required: true
          schema: { type: integer, example: 7 }
      responses:
        "200":
          description: PDF файл с заявкой
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Доступ запрещен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "This action is unauthorized." }
        "422":
          description: Ошибка при экспорте
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка при экспорте" }
                  errors:
                    type: object
                    properties:
                      service:
                        type: array
                        items:
                          type: string
                          example: "У вас нет доступа к этой заявке"
        "401":
          description: Не авторизован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Не авторизован" }
        "500":
          description: Ошибка генерации PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: "Ошибка при генерации PDF: ..." }

