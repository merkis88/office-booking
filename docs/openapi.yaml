  /admin/users/block:
    post:
      tags: [ "Merk · Admin" ]
      summary: Block user by email
      description: |
        Owner: merk

        Middleware:
        - auth:sanctum
        - is_admin

        Handler: BlockUserHandler

        Логика:
        - admin передаёт email пользователя в body
        - система ищет пользователя по email
        - если пользователь не найден -> 422
        - если admin пытается заблокировать сам себя -> 422
        - если пользователь уже заблокирован -> 422
        - иначе users.is_blocked = true
        - создаётся запись в user_blocks:
          - user_id
          - blocked_by
          - reason
        - при последующем login пользователь получает ошибку "Ваш профиль заблокирован"
        - middleware not_blocked запрещает доступ заблокированному пользователю к защищённым маршрутам

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email:
                  type: string
                  format: email
                  example: user@user.com
                reason:
                  type: string
                  nullable: true
                  example: Нарушение правил бронирования

      responses:
        "200":
          description: User blocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"


  /admin/users/unblock:
    post:
      tags: [ "Merk · Admin" ]
      summary: Unblock user by email
      description: |
        Owner: merk

        Middleware:
        - auth:sanctum
        - is_admin

        Handler: UnblockUserHandler

        Логика:
        - admin передаёт email пользователя в body
        - система ищет пользователя по email
        - если пользователь не найден -> 422
        - если admin пытается разблокировать сам себя этим методом -> 422
        - если пользователь не заблокирован -> 422
        - иначе users.is_blocked = false

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email ]
              properties:
                email:
                  type: string
                  format: email
                  example: user@user.com

      responses:
        "200":
          description: User unblocked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"

        "401":
          description: Unauthorized

        "403":
          description: Forbidden

        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"


